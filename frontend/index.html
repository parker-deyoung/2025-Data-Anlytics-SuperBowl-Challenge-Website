<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Bowl Data Analytics Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="hero">
    <div class="hero__content">
      <span class="hero__eyebrow">2025 Challenge</span>
      <h1 class="hero__title">Super Bowl Data<br>Analytics Challenge</h1>
      <hr class="hero__divider" />
    </div>
  </main>
  <!-- ── Chatbot Toggle Button ── -->
  <button class="chat-toggle" id="chatToggle" aria-label="Open analytics chat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <!-- ── Chatbot Panel ── -->
  <aside class="chat-panel" id="chatPanel" aria-hidden="true">
    <header class="chat-panel__header">
      <span class="chat-panel__title">Data Analytics</span>
      <button class="chat-panel__close" id="chatClose" aria-label="Close chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>

    <div class="chat-panel__messages" id="chatMessages" role="log" aria-live="polite">
      <div class="chat-msg chat-msg--bot">
        <p>Ask me anything about the Super Bowl tweet data — brands, engagement, trends, and more.</p>
      </div>
    </div>

    <form class="chat-panel__input-row" id="chatForm" autocomplete="off">
      <input
        type="text"
        id="chatInput"
        class="chat-panel__input"
        placeholder="e.g. How many tweets did Pepsi get?"
        aria-label="Chat message"
        maxlength="300"
      />
      <button type="submit" class="chat-panel__send" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </aside>

  <script src="js/main.js"></script>
</body>
</html>
